apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdb-frontend
  namespace: cdb-kanban
  labels:
    app: cdb-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cdb-frontend
  template:
    metadata:
      labels:
        app: cdb-frontend
    spec:
      terminationGracePeriodSeconds: 8
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cdb-frontend
          matchLabelKeys:
            - pod-template-hash
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
      containers:
        - name: frontend
          image: quanq026/cdb-kanban-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "2"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: cdb-kanban
  labels:
    app: cdb-frontend
spec:
  type: NodePort
  selector:
    app: cdb-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
