log_format fe_web '[$time_iso8601] [FE node=$fe_node pod=$fe_pod ver=$fe_ver] "$request" -> $status (${request_time}s) client=$remote_addr';
log_format fe_api '[$time_iso8601] [FE node=$fe_node pod=$fe_pod ver=$fe_ver] "$request" -> $status (${request_time}s) be=$upstream_http_x_backend_node/$upstream_http_x_backend_pod($upstream_status) client=$remote_addr';

map $status $is_http_error {
    ~^[45] 1;
    default 0;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/pod-meta.inc;
    access_log /var/log/nginx/access.log fe_web;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location = /frontend-info.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/ {
        access_log /var/log/nginx/access.log fe_api;
        proxy_pass http://backend-svc:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Frontend-Node $fe_node;
        proxy_set_header X-Frontend-Pod $fe_pod;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~* \.(css|js)$ {
        access_log /var/log/nginx/access.log fe_web if=$is_http_error;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
